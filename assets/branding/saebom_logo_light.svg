<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      .hangul { font-family: 'Pretendard', 'NanumSquare', -apple-system, sans-serif; font-weight: 800; font-size: 110px; fill: #02060F; text-anchor: middle; letter-spacing: 4px; }
      .companion { font-family: 'Pretendard', 'NanumSquare', sans-serif; font-weight: 700; font-size: 26px; fill: #8B4DFF; text-anchor: middle; letter-spacing: 14px; }
      .sub { font-family: 'Pretendard', 'NanumBarunGothic', sans-serif; font-weight: 500; font-size: 16px; fill: #9EA2AE; text-anchor: middle; letter-spacing: 8px; }
    </style>
  </defs>
  <!-- Texto Hangul Principal -->
  <text x="400" y="210" class="hangul">새봄</text>
  <!-- Descriptor de Categoria -->
  <text x="407" y="280" class="companion">COMPANION</text>
  <!-- Assinatura Verbal Latina -->
  <text x="404" y="330" class="sub">SAEBOM COMPANION</text>
</svg>