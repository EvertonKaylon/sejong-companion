<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Mouth Shape - I [ㅣ]</title>
  <!-- Spread smiling lips, narrow vertical gap -->
  <path d="M 14,48 C 24,38 76,38 86,48 C 76,64 24,64 14,48 Z" fill="#2A1B3D" stroke="#8B4DFF" stroke-width="3"/>
  <!-- Oral cavity: wide and narrow -->
  <ellipse cx="50" cy="49" rx="30" ry="7" fill="#150B24"/>
  <!-- Tongue: High front position elevated towards hard palate -->
  <ellipse cx="50" cy="51" rx="26" ry="5" fill="#E85D75"/>
  <!-- Upper Lip -->
  <path d="M 14,48 C 30,42 50,45 50,45 C 50,45 70,42 86,48" stroke="#B28AFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Lower Lip -->
  <path d="M 18,50 C 32,60 50,61 50,61 C 50,61 68,60 82,50" stroke="#B28AFF" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
