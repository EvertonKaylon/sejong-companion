<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Mouth Shape - O [ㅗ]</title>
  <!-- Rounded puckered circular mouth -->
  <circle cx="50" cy="50" r="28" fill="#2A1B3D" stroke="#8B4DFF" stroke-width="3"/>
  <!-- Oral cavity: small round aperture -->
  <circle cx="50" cy="50" r="16" fill="#150B24"/>
  <!-- Tongue: Back elevated -->
  <ellipse cx="50" cy="55" rx="12" ry="6" fill="#E85D75"/>
  <!-- Lip contour: Prominent rounded pucker -->
  <circle cx="50" cy="50" r="23" stroke="#B28AFF" stroke-width="4" fill="none"/>
</svg>
