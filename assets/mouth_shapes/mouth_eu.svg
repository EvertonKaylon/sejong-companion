<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Mouth Shape - EU [ㅡ]</title>
  <!-- Horizontally stretched, slit mouth -->
  <ellipse cx="50" cy="50" rx="36" ry="12" fill="#2A1B3D" stroke="#8B4DFF" stroke-width="3"/>
  <!-- Oral slit -->
  <ellipse cx="50" cy="50" rx="28" ry="5" fill="#150B24"/>
  <!-- Tongue: Flat mid-high position visible in slit -->
  <rect x="26" y="49" width="48" height="4" rx="2" fill="#E85D75"/>
  <!-- Upper & Lower Lip Contour: Flat horizontal line -->
  <path d="M 12,49 C 30,47 50,47 50,47 C 50,47 70,47 88,49" stroke="#B28AFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 16,51 C 32,54 50,55 50,55 C 50,55 68,54 84,51" stroke="#B28AFF" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
