  <rect x="10" y="40" width="80" height="8" rx="2" fill="#6A2BD9" stroke="#FFAB22" stroke-width="1.5"/>
  <!-- Front Left Leg -->
  <rect x="14" y="48" width="5" height="42" rx="1.5" fill="#F7F4EC" stroke="#9EA2AE" stroke-width="1"/>
  <!-- Front Right Leg -->
  <rect x="81" y="48" width="5" height="42" rx="1.5" fill="#F7F4EC" stroke="#9EA2AE" stroke-width="1"/>
  <!-- Back Left Leg -->
  <rect x="22" y="42" width="4" height="40" rx="1" fill="#9EA2AE"/>
  <!-- Back Right Leg -->
  <rect x="74" y="42" width="4" height="40" rx="1" fill="#9EA2AE"/>
