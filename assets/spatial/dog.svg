<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Dog (강아지)</title>
  <!-- Body -->
  <ellipse cx="48" cy="62" rx="24" ry="16" fill="#FFAB22" stroke="#8B4DFF" stroke-width="2"/>
  <!-- Head -->
  <circle cx="68" cy="44" r="16" fill="#FFAB22" stroke="#8B4DFF" stroke-width="2"/>
  <!-- Snout -->
  <ellipse cx="78" cy="48" rx="8" ry="6" fill="#F7F4EC" stroke="#8B4DFF" stroke-width="1.5"/>
  <ellipse cx="82" cy="46" rx="3" ry="2" fill="#02060F"/>
  <!-- Eye -->
  <circle cx="70" cy="40" r="2.5" fill="#02060F"/>
  <circle cx="71" cy="39" r="0.8" fill="#FFFFFF"/>
  <!-- Floppy Ear -->
  <path d="M 60,34 C 54,34 50,44 54,50 C 58,54 64,44 64,36 Z" fill="#6A2BD9"/>
  <!-- Front Leg -->
  <rect x="62" y="68" width="6" height="20" rx="3" fill="#FFAB22" stroke="#8B4DFF" stroke-width="1.5"/>
  <rect x="70" y="68" width="6" height="20" rx="3" fill="#FFAB22" stroke="#8B4DFF" stroke-width="1.5"/>
  <!-- Back Leg -->
  <rect x="30" y="68" width="6" height="20" rx="3" fill="#FFAB22" stroke="#8B4DFF" stroke-width="1.5"/>
  <rect x="38" y="68" width="6" height="20" rx="3" fill="#FFAB22" stroke="#8B4DFF" stroke-width="1.5"/>
  <!-- Tail Wagging -->
  <path d="M 26,58 C 18,52 14,38 22,34" fill="none" stroke="#FFAB22" stroke-width="4" stroke-linecap="round"/>
</svg>
