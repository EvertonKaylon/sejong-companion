<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Chair (의자)</title>
  <!-- Backrest -->
  <rect x="30" y="15" width="40" height="35" rx="5" fill="#8B4DFF" stroke="#FFAB22" stroke-width="2"/>
  <line x1="38" y1="20" x2="38" y2="45" stroke="#FFAB22" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="45" stroke="#FFAB22" stroke-width="2"/>
  <line x1="62" y1="20" x2="62" y2="45" stroke="#FFAB22" stroke-width="2"/>
  <!-- Seat Cushion -->
  <rect x="22" y="50" width="56" height="12" rx="4" fill="#B28AFF" stroke="#FFAB22" stroke-width="2"/>
  <!-- Front Legs -->
  <line x1="26" y1="62" x2="24" y2="88" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="76" y2="88" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round"/>
  <!-- Back Legs -->
  <line x1="34" y1="62" x2="34" y2="82" stroke="#9EA2AE" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="62" x2="66" y2="82" stroke="#9EA2AE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="25" y1="75" x2="75" y2="75" stroke="#FFAB22" stroke-width="1.5"/>
</svg>
