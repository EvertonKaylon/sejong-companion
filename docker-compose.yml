services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saebom-companion-app
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=8554
      - SAEBOM_ADMIN_PIN=${SAEBOM_ADMIN_PIN:-}
      - TYPECAST_API_KEY=${TYPECAST_API_KEY:-}
    expose:
      - "8554"
    volumes:
      # Volumes persistentes para que dados de estudo, comunicados e áudio nunca sejam perdidos
      - ./data/cache/audio:/app/data/cache/audio
      - ./data/sessions:/app/data/sessions
      - ./data/telemetry:/app/data/telemetry
      - ./data/reports:/app/data/reports
      - ./data/announcements.json:/app/data/announcements.json

  # Reverse Proxy Caddy para HTTPS automático com Let's Encrypt e compressão
  caddy:
    image: caddy:2-alpine
    container_name: saebom-companion-caddy
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
