services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saebom-companion-app
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - PORT=8554
      - SAEBOM_ADMIN_PIN=${SAEBOM_ADMIN_PIN:?SAEBOM_ADMIN_PIN environment variable is required}
      - SAEBOM_ANNOUNCEMENTS_PATH=/app/data/announcements/announcements.json
      - TYPECAST_API_KEY=${TYPECAST_API_KEY:-}
    expose:
      - "8554"
    volumes:
      # Named volumes persistentes (evitam conflito de permissão UID 10001 e EBUSY em bind mounts)
      - saebom_audio_cache:/app/data/cache/audio
      - saebom_sessions:/app/data/sessions
      - saebom_telemetry:/app/data/telemetry
      - saebom_reports:/app/data/reports
      - saebom_announcements:/app/data/announcements

  # Reverse Proxy Caddy para HTTPS automático com Let's Encrypt e compressão
  caddy:
    image: caddy:2-alpine
    container_name: saebom-companion-caddy
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  saebom_audio_cache:
  saebom_sessions:
  saebom_telemetry:
  saebom_reports:
  saebom_announcements:
  caddy_data:
  caddy_config:
