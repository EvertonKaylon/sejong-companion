name: Saebom Companion CI & Security Gates

on:
  push:
    branches:
      - main
      - develop
      - 'security/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-security:
    name: Test & Security Hardening Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio pytest-asyncio

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m compileall src tests

      - name: Secret Scanning (Hardcoded Defaults Check)
        run: |
          echo "Scanning codebase for compromised hardcoded fallback secrets..."
          if grep -rn "sejong2026" src/ main.py scripts/ docker-compose.yml Caddyfile; then
            echo "ERROR: Compromised default PIN 'sejong2026' detected in codebase!"
            exit 1
          fi
          echo "Secret check passed: No default admin credentials found."

      - name: Run Test Suite (Unit & Integration)
        env:
          SAEBOM_ADMIN_PIN: "ci_test_admin_pin_987654"
        run: |
          pytest tests/ --ignore=tests/test_playwright_e2e.py -v

  security-qa:
    name: Security QA (SAST, SCA & Hardening Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies and security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio pytest-asyncio bandit pip-audit

      - name: Run Security QA Audit Script
        run: |
          python -m scripts.security_qa_audit

      - name: Run Bandit SAST (High Severity)
        run: |
          bandit -r src main.py -lll -ii

      - name: Run Dependency Vulnerability Audit (pip-audit Advisory)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Run Security Test Battery
        env:
          SAEBOM_ADMIN_PIN: "ci_test_admin_pin_987654"
        run: |
          pytest tests/test_admin_auth_hardening.py tests/test_student_identity_security.py tests/test_telemetry_privacy_and_rotation.py tests/test_infrastructure_security.py tests/test_security_qa_pipeline.py -v

  design-qa:
    name: Design QA (Brand Book v3.1, WCAG & Tokens)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Design QA Audit Script
        run: |
          python -m scripts.design_qa_audit

      - name: Run Design System & Branding Tests
        run: |
          pytest tests/test_theme.py tests/test_branding_assets.py tests/test_design_qa_pipeline.py -v

  e2e-playwright:
    name: E2E Playwright (Chromium)
    runs-on: ubuntu-latest
    needs: [test-and-security, security-qa, design-qa]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies and Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest anyio pytest-asyncio playwright
          python -m playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        env:
          SAEBOM_ADMIN_PIN: "ci_test_admin_pin_987654"
        run: |
          pytest tests/test_playwright_e2e.py -v
